# benchmark/models.yaml
#
# GitHub Copilot models for the adag benchmark.
#
# Billing model (effective June 1, 2026): usage-based per-token pricing.
# 1 AI credit = $0.01 USD. All prices below are per 1M tokens (USD).
# Source: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing#pricing-tables
#
# pricing.included: true  — model is included in paid plan allowances (no extra charge within limits)
# pricing.input_usd_per_1m  — cost per 1M input tokens
# pricing.output_usd_per_1m — cost per 1M output tokens
#
# Actual USD cost per scan is parsed from arch_agent's core.cost_tracker log
# lines ([COST] in stderr) — no extra config needed.
#
# To test only a subset, comment out unwanted entries.

models:
  # ── Included models (within plan allowances) ──────────────────────────────

  - name: gpt-4.1-copilot
    display_name: "GPT-4.1 (Copilot)"
    env:
      LLM_PROVIDER: github-copilot
      GITHUB_COPILOT_MODEL: gpt-4.1
      INTAKE_MODEL: gpt-4.1
      AUDITOR_MODEL: gpt-4.1
    pricing:
      tier: Versatile
      included: true
      input_usd_per_1m: 2.00
      output_usd_per_1m: 8.00

  - name: gpt-4o-copilot
    display_name: "GPT-4o (Copilot)"
    env:
